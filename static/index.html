<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PECA 2016 AI - Legal Assistant</title>
    <meta name="description" content="Premium Chatbot specialized in The Prevention of Electronic Crimes Act, 2016 (PECA) of Pakistan">
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <div class="logo-pulse">
                    <div class="logo">⚖️</div>
                </div>
                <div class="header-text">
                    <h1>PECA 2016 AI</h1>
                    <p>Intelligent Legal Assistant</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="clear-btn" class="clear-btn" title="Clear Chat">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
                <div class="status-indicator">
                    <span class="pulse-dot"></span> Online
                </div>
            </div>
        </header>

        <main class="chat-container" id="chat-container">
            <div class="message bot-message">
                <div class="avatar">🤖</div>
                <div class="message-content">
                    <p>Welcome! I am an advanced AI specializing in <strong>The Prevention of Electronic Crimes Act, 2016 (PECA)</strong>. You can ask me questions about cybercrimes, penalties, and definitions under Pakistani law. How can I assist you today?</p>
                </div>
            </div>
        </main>

        <footer class="input-container">
            <form id="chat-form">
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="Type your legal question here..." autocomplete="off" required>
                    <button type="submit" id="send-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </form>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
